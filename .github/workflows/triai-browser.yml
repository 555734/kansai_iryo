name: TriAI Android CI

on:
  workflow_dispatch:
  push:
    branches: [ triai-browser-actions ]
    paths:
      - 'triai-browser/**'
      - '.github/workflows/triai-browser.yml'

jobs:
  build-and-static-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version
      - name: Run Gradle checks and capture diagnostics
        shell: bash
        run: |
          cd triai-browser
          mkdir -p ci-logs
          set +e
          /tmp/gradle-8.9/bin/gradle :app:testDebugUnitTest --stacktrace > ci-logs/unit.log 2>&1
          echo $? > ci-logs/unit.exit
          /tmp/gradle-8.9/bin/gradle :app:lintDebug --stacktrace > ci-logs/lint.log 2>&1
          echo $? > ci-logs/lint.exit
          /tmp/gradle-8.9/bin/gradle :app:assembleDebug --stacktrace > ci-logs/build.log 2>&1
          echo $? > ci-logs/build.exit
          set -e
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triai-ci-diagnostics
          path: triai-browser/ci-logs
          if-no-files-found: error
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triai-browser-debug
          path: triai-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Enforce Gradle results
        shell: bash
        run: |
          cd triai-browser
          unit=$(cat ci-logs/unit.exit)
          lint=$(cat ci-logs/lint.exit)
          build=$(cat ci-logs/build.exit)
          echo "unit=$unit lint=$lint build=$build"
          test "$unit" = 0
          test "$lint" = 0
          test "$build" = 0

  emulator-smoke-test:
    needs: build-and-static-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Install Android emulator image
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n triai_api35 \
            -k "system-images;android-35;google_apis;x86_64" \
            --force
      - name: Start emulator
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd triai_api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for i in $(seq 1 120); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/emulator.log
          exit 1
      - name: Run emulator smoke test
        shell: bash
        run: |
          cd triai-browser
          mkdir -p ci-logs
          set +e
          /tmp/gradle-8.9/bin/gradle :app:connectedDebugAndroidTest --stacktrace > ci-logs/instrumentation.log 2>&1
          code=$?
          echo $code > ci-logs/instrumentation.exit
          "$ANDROID_HOME/platform-tools/adb" logcat -d > ci-logs/logcat.txt 2>&1 || true
          set -e
          exit $code
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triai-emulator-diagnostics
          path: |
            triai-browser/ci-logs
            /tmp/emulator.log
          if-no-files-found: warn
