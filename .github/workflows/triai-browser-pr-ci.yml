name: TriAI Android PR CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'triai-browser/**'
  workflow_dispatch:

jobs:
  build-and-static-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle --version
      - name: Install Android API 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Run Gradle checks and capture diagnostics
        shell: bash
        run: |
          cd triai-browser
          mkdir -p ci-logs
          set +e
          /tmp/gradle-8.11.1/bin/gradle :app:testDebugUnitTest --stacktrace > ci-logs/unit.log 2>&1
          echo $? > ci-logs/unit.exit
          /tmp/gradle-8.11.1/bin/gradle :app:lintDebug --stacktrace > ci-logs/lint.log 2>&1
          echo $? > ci-logs/lint.exit
          /tmp/gradle-8.11.1/bin/gradle :app:assembleDebug --stacktrace > ci-logs/build.log 2>&1
          echo $? > ci-logs/build.exit
          set -e
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triai-ci-diagnostics
          path: triai-browser/ci-logs
          if-no-files-found: error
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triai-browser-debug
          path: triai-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Enforce Gradle results
        shell: bash
        run: |
          cd triai-browser
          unit=$(cat ci-logs/unit.exit)
          lint=$(cat ci-logs/lint.exit)
          build=$(cat ci-logs/build.exit)
          echo "unit=$unit lint=$lint build=$build"
          test "$unit" = 0
          test "$lint" = 0
          test "$build" = 0

  emulator-smoke-test:
    needs: build-and-static-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Install Android API 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd triai-browser && /tmp/gradle-8.11.1/bin/gradle :app:connectedDebugAndroidTest --stacktrace
